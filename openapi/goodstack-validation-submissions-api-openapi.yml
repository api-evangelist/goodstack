                  type:
                  - array
                  - 'null'
                  items:
                    type: string
                    example: activitysubtag_xxxxxxxxxxxxxxxxxxxxxxxxxxxxx
        monitoring:
          type: object
          properties:
            status:
              type: string
              example: live
              enum:
              - live
              - pending_validation_request
              - validation_request_failed
              - pending
              - cancelled
            results:
