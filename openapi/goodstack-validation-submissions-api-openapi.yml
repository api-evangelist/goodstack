openapi: 3.2.0
info:
  title: Goodstack Services Validation Submissions API
  version: v1
  x-logo:
    url: https://docs.goodstack.io/img/logo.png
    altText: Goodstack logo
  x-dark-logo:
    url: https://docs.goodstack.io/img/icons/Logo-white.svg
    altText: Goodstack logo
  contact:
    email: engineering-support@goodstack.io
    name: Api support
  description: '# Introduction


    Goodstack API allows you to build good into your product by facilitating charitable donations. We achieve this through the API''s listed and specified in this documentation. For all donations using the Goodstack API, Goodstack handles the vetting and validation of the good causes and onward the disbursement of the donation. The Goodstack API is organised around REST. All API responses, including errors, return JSON and use standard HTTP response codes. In all API requests you must specify the content-type HTTP header as application/json. All API requests must be made over HTTPS. # Authentication


    Authenticate your API requests by setting your live secret API key in the Authorization header. Two keys are provided to you, a publishable key prefixed with `pk_` and a secret key prefixed with `sk_`. Publishable API keys are meant solely to identify your goodstack account. These can safely be published in places like your JavaScript code, or in an Android or iPhone app and are meant for usage with our SDKs. Secret API keys should be kept confidential and only used in secure server environments. Anywhere that accepts a Publishable key will also accept a Secret key, but routes marked to accept a Secret key will not accept a Publishable key. # Formats


    ## IDs


    All ID fields are case-sensitive. For example, `abc123` and `ABC123` are treated as different IDs. ## Dates


    Dates are encoded as strings following the ISO 8601 standard `2025-08-01T12:00:00.000Z`. ## Pagination


    A maximum of 100 objects can be returned per request and the limit can be specified by using the pageSize query parameter. By default, the pageSize is set to 25. A `_links` object is included in paginated responses, which contains `next` and `prev` URLs to retrieve the next or previous pages of results. ## Monetary Values


    Throughout the API, monetary values are encoded as integers representing the amount in the smallest currency unit, for example 100 cents for a donation of $1.00. Currency is encoded as a string following the ISO 4217 standard (e.g. `USD`). ## Metadata


    Some objects have a metadata parameter that you can use to store key-value data. You can specify up to 20 keys, with key names up to 40 characters long and values up to 250 characters long. ## Errors


    The API returns standard HTTP response codes to indicate success or failure of API requests. Errors may include a custom error message. Error objects have these attributes, an `id`, a `message` corresponding to the HTTP response phrase of the error,

    an optional `invalid-params` attribute detailing issues with the request. An example error object returned from the API:

    ```json

    {

    error: {

    code: ''bad_request'',

    title: ''Bad request'',

    message: ''Something is wrong with your request, please check any parameters and try again'',

    reasons: [''amount is a required field'']

    }

    }

    ```


    A summary of the HTTP status codes returned from the api is listed in the table below. | Code | Title | Description |

    | ------------- |-------------| -----|

    | 200 | Success | Request successful |

    | 204 | No Content | Request successful with no content returned |

    | 400 | Bad Request | Request was invalid |

    | 401 | Unauthorised | Authorization header is invalid |

    | 403 | Forbidden | Insufficient permissions |

    | 404 | Not Found | Resource does not exist |

    | 429 | Too Many Requests | Rate Limited |

    | 500s | Internal Server Error | Something went wrong with the Goodstack API |


    # Enum Values


    Generally enum fields in our API are open-ended. New values may be added to an enum and this is not considered a breaking change. ## Integrating safely


    If your code handles enum values exhaustively — for example, a switch without a default case, or deserialisation into a strict typed enum — an unrecognised value may cause errors. We recommend adding a fallback handler for unknown enum values, so that any new value that does reach your integration degrades gracefully rather than failing.'
servers:
- url: https://api.goodstack.io
  description: Production server
- url: https://sandbox-api.goodstack.io
  description: Sandbox server
tags:
- name: Validation Submissions
paths:
  /v1/validation-submissions:
    get:
      security:
      - SecretApiKey: []
      summary: List Validation Submissions
      tags:
      - Validation Submissions
      parameters:
      - $ref: '#/components/parameters/direction'
      - $ref: '#/components/parameters/cursor'
      - $ref: '#/components/parameters/pageSize'
      - in: query
        name: status
        deprecated: true
        schema:
          type: string
          enum:
          - pending
          - processed
          - failed
          - succeeded
        description: Filter by Validation Submission status
      - in: query
        name: statuses
        schema:
          type: array
          items:
            type: string
            enum:
            - pending
            - processed
            - failed
            - succeeded
        description: Filter by multiple statuses
      - in: query
        name: configurationIds
        schema:
          type: array
          items:
            type: string
        description: Filter by multiple configuration ids
      - in: query
        name: email
        schema:
          type: string
          description: Filter by agent verification email
      - in: query
        name: validationRequestIds
        schema:
          type: array
          items:
            type: string
          description: Filter by validation request ids
      - in: query
        name: organisationIds
        schema:
          type: array
          items:
            type: string
          description: Filter by organisation ids
      - in: query
        name: query
        schema:
          type: string
        description: Search by agent verification email, organisation name or validation request name
        example: example@example.com
      - in: query
        name: countryCodes
        schema:
          type: array
          items:
            type: string
          description: Filter by 3-letter ISO country code
      - in: query
        name: startDate
        schema:
          type: string
          format: date-time
        description: Filter submissions created on or after this date
        example: '2025-01-01T00:00:00.000Z'
      - in: query
        name: endDate
        schema:
          type: string
          format: date-time
        description: Filter submissions created on or before this date
        example: '2025-12-31T23:59:59.000Z'
      responses:
        '200':
          description: Successfully retrieved list of Validation Submissions
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      allOf:
                      - $ref: '#/components/schemas/ValidationSubmission'
                      - type: object
                        properties:
                          agentVerificationEmail:
                            type:
                            - string
                            - 'null'
                            deprecated: true
                          agentVerificationFirstName:
                            type:
                            - string
                            - 'null'
                            deprecated: true
                          agentVerificationLastName:
                            type:
                            - string
                            - 'null'
                            deprecated: true
                  object:
                    type: string
                    example: validation_submission
                  totalResults:
                    type: integer
                    example: 33
                  pageSize:
                    type: integer
                    example: 25
                  _links:
                    $ref: '#/components/schemas/CursorLinks'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                IncorrectParams:
                  $ref: '#/components/examples/IncorrectParams'
                CursorError:
                  $ref: '#/components/examples/Pagination.CursorError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenScope'
      operationId: getV1ValidationSubmissions
      x-operation-id-source: derived
    post:
      security:
      - SecretApiKey: []
      summary: Create a Validation Submission
      tags:
      - Validation Submissions
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        required: false
        description: Idempotency key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - type: object
                properties:
                  configurationId:
                    type: string
                    description: Id of the Validation Submission Configuration associated with submission
                    example: hostedconfiguration_xxxxxxxxxxxxxxxxxxxxxxxxxxxxx
                  organisationName:
                    type: string
                    description: Name of organisation
                    maxLength: 255
                  registryName:
                    type: string
                    description: Name of organisation's registry
                    maxLength: 255
                  registryId:
                    type: string
                    description: Organisations's id in registry
                  organisationEmail:
                    type: string
                    description: Organisation's email
                    example: test@goodstack.internal
                    maxLength: 255
                  addressLine1:
                    type: string
                    description: Organisation's address line 1
                    example: 44 Clipstone St
                    maxLength: 255
                  addressLine2:
                    type: string
                    description: Organisation's address line 2
                    example: House 40, Threeways
                    maxLength: 255
                  city:
                    type: string
                    description: Organisation's city
                    example: London
                    maxLength: 255
                  postal:
                    type: string
                    description: Organisation's postal code
                    example: W1W 5DW
                    maxLength: 255
                  state:
                    type: string
                    description: Organisation's state
                    example: Texas
                    maxLength: 255
                  website:
                    type: string
                    description: Organisation's website
                    format: website
                    example: https://example.com
                    maxLength: 255
                  countryCode:
                    type: string
                    description: Three-letter ISO country code
                    example: POL
                  firstName:
                    type: string
                    description: First name of Agent
                    example: Max
                    maxLength: 255
                  lastName:
                    type: string
                    description: Last name of Agent
                    example: Plank
                    maxLength: 255
                  email:
                    type: string
                    description: Email of Agent
                    example: test@goodstack.internal
                    maxLength: 255
                  title:
                    type: string
                    example: Board Member
                    description: Agent's job title
                    maxLength: 255
                  language:
                    type: string
                    description: Valid RFC 5646 language code
                    example: en-GB
                  metadata:
                    description: Metadata object.
                    type: object
                    maxProperties: 20
                    additionalProperties:
                      description: Max key size is 40 characters
                      type: string
                      maxLength: 250
                required:
                - organisationName
                - registryName
                - registryId
                - website
                - countryCode
                - language
              - type: object
                properties:
                  configurationId:
                    type: string
                    description: Id of the Validation Submission Configuration
                    example: hostedconfiguration_xxxxxxxxxxxxxxxxxxxxxxxxxxxxx
                  organisationId:
                    type: string
                    description: OrganisationId of the Agent
                    example: organisation_xxxxxxxxxxxxxxxxxxxxxxxxxxxxx
                  firstName:
                    type: string
                    description: First name of Agent
                    example: Max
                    maxLength: 255
                  lastName:
                    type: string
                    description: Last name of Agent
                    example: Plank
                    maxLength: 255
                  email:
                    type: string
                    description: Email of Agent
                    example: test@goodstack.internal
                    maxLength: 255
                  title:
                    type: string
                    example: Board Member
                    description: Agent's job title
                    maxLength: 255
                  website:
                    type: string
                    description: Organization's website
                    format: website
                    example: https://goodstack.internal
                    maxLength: 255
                  language:
                    type: string
                    description: Valid RFC 5646 language code
                    example: en-GB
                  metadata:
                    description: Metadata object.
                    type: object
                    maxProperties: 20
                    additionalProperties:
                      description: Max key size is 40 characters. If key matches already existing key, it will override old value
                      type: string
                      maxLength: 250
                required:
                - organisationId
                - language
      responses:
        '200':
          description: Successfully created a Validation Submission
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/SingleApiValidationSubmission'
                  object:
                    type: string
                    example: validation_submission
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                OrganisationNotFound:
                  $ref: '#/components/examples/ValidationSubmission.OrganisationNotFound'
                OrganisationNotActive:
                  $ref: '#/components/examples/ValidationSubmission.OrganisationNotActive'
                ValidationSubmissionDocumentNotFound:
                  $ref: '#/components/examples/ValidationSubmission.ValidationSubmissionDocumentNotFound'
                ValidationRequestNotFound:
                  $ref: '#/components/examples/ValidationSubmission.ValidationRequestNotFound'
                ValidationRequestAlreadyRejected:
                  $ref: '#/components/examples/ValidationSubmission.ValidationRequestAlreadyRejected'
                EntityNotFound:
                  $ref: '#/components/examples/ValidationSubmission.EntityNotFound'
                InvalidSubTags:
                  $ref: '#/components/examples/ValidationSubmission.InvalidSubTags'
                InvalidConfiguration:
                  $ref: '#/components/examples/ValidationSubmission.InvalidConfiguration'
                OriginalCallInProgress:
                  $ref: '#/components/examples/Idempotency.OriginalCallInProgress'
                SameKeyDifferentData:
                  $ref: '#/components/examples/Idempotency.SameKeyDifferentData'
                KeyInUse:
                  $ref: '#/components/examples/Idempotency.KeyInUse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenScope'
      operationId: postV1ValidationSubmissions
      x-operation-id-source: derived
  /v1/validation-submissions/{id}:
    parameters:
    - in: path
      name: id
      schema:
        type: string
      required: true
      description: Id of the Validation Submission.
    get:
      security:
      - SecretApiKey: []
      summary: Retrieve a Validation Submission
      tags:
      - Validation Submissions
      responses:
        '200':
          description: Successfully retrieves a Validation Submission
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    allOf:
                    - $ref: '#/components/schemas/ValidationSubmission'
                    - type: object
                      properties:
                        agentVerificationEmail:
                          type:
                          - string
                          - 'null'
                          deprecated: true
                        agentVerificationFirstName:
                          type:
                          - string
                          - 'null'
                          deprecated: true
                        agentVerificationLastName:
                          type:
                          - string
                          - 'null'
                          deprecated: true
                        agentVerificationRejectionReason:
                          type:
                          - string
                          - 'null'
                          deprecated: true
                          enum:
                          - Validation request failed
                          - User verification expired
                          - Identity check failed
                          - No evidence agent’s email is associated with organisation
                          - Agent/nonprofit will reapply
                          - Agent used fake or test email
                          - No online presence to complete check
                          - Other
                        agentVerificationRejectionReasonCode:
                          type:
                          - string
                          - 'null'
                          deprecated: true
                          enum:
                          - validation_request_failed
                          - user_verification_expired
                          - user_failed_percent_review
                          - invalid_documentation
                          - invalid_role
                          - expired_documentation
                          - reapply
                          - fake_email_used
                          - no_online_presence
                          - fake_documentation
                          - mismatched_information
                          - blank_corrupted_documentation
                          - suspicious_application
                          - other
                        agentVerificationStatus:
                          type: string
                          deprecated: true
                          enum:
                          - pending
                          - pending_user_verification
                          - pending_review
                          - approved
                          - rejected
                        validationRequestAcceptedAt:
                          type:
                          - string
                          - 'null'
                          format: date-time
                          example: '2022-02-02T17:46:54.000Z'
                          deprecated: true
                        validationRequestRejectedAt:
                          type:
                          - string
                          - 'null'
                          format: date-time
                          example: '2022-02-02T17:46:54.000Z'
                          deprecated: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenScope'
        '404':
          $ref: '#/components/responses/NotFound'
      operationId: getV1ValidationSubmissionsById
      x-operation-id-source: derived
components:
