            rejectedAt:
              type:
              - string
              - 'null'
              format: date-time
              example: '2022-02-02T17:46:54.000Z'
            id:
              type: string
              example: validationrequest_xxxxxxxxxxxxxxxxxxxxxxxxxxxxx
            name:
              type:
              - string
              - 'null'
            organisationTypes:
              type: array
              items:
                type: string
                enum:
                - nonprofit
                - social_impact
        eligibility:
          type: object
          properties:
