                  - fail
                  example: fail
                confirmedActivitySubTags:
                  type:
                  - array
                  - 'null'
                  items:
                    type: string
                    example: activitysubtag_xxxxxxxxxxxxxxxxxxxxxxxxxxxxx
                rejectedActivitySubTags:
