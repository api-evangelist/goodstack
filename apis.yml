aid: goodstack
name: Goodstack
description: >-
  Goodstack (formerly Percent) is an impact platform whose REST API lets
  businesses build charitable giving, nonprofit verification, and fund
  disbursement into their own products. The Goodstack Services API covers
  monetary donations (direct and via a hosted donation gateway), a global
  registry of verified nonprofit and educational organisations, organisation
  name search, eligibility and monitoring subscriptions, agent verifications,
  validation requests and submissions, Gift Aid declarations, categories, and
  webhook subscriptions. Goodstack handles the vetting, validation, and timely
  disbursement of donations to good causes across multiple countries and
  currencies. The API is organised around REST, uses API-key authentication
  (publishable pk_ and secret sk_ keys), returns JSON with standard HTTP status
  codes, and offers a sandbox environment.
