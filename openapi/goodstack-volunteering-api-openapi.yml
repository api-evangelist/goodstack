openapi: 3.2.0
info:
  title: Goodstack Services Volunteering API
  version: v1
  x-logo:
    url: https://docs.goodstack.io/img/logo.png
    altText: Goodstack logo
  x-dark-logo:
    url: https://docs.goodstack.io/img/icons/Logo-white.svg
    altText: Goodstack logo
  contact:
    email: engineering-support@goodstack.io
    name: Api support
  description: '# Introduction


    Goodstack API allows you to build good into your product by facilitating charitable donations. We achieve this through the API''s listed and specified in this documentation. For all donations using the Goodstack API, Goodstack handles the vetting and validation of the good causes and onward the disbursement of the donation. The Goodstack API is organised around REST. All API responses, including errors, return JSON and use standard HTTP response codes. In all API requests you must specify the content-type HTTP header as application/json. All API requests must be made over HTTPS. # Authentication


    Authenticate your API requests by setting your live secret API key in the Authorization header. Two keys are provided to you, a publishable key prefixed with `pk_` and a secret key prefixed with `sk_`. Publishable API keys are meant solely to identify your goodstack account. These can safely be published in places like your JavaScript code, or in an Android or iPhone app and are meant for usage with our SDKs. Secret API keys should be kept confidential and only used in secure server environments. Anywhere that accepts a Publishable key will also accept a Secret key, but routes marked to accept a Secret key will not accept a Publishable key. # Formats


    ## IDs


    All ID fields are case-sensitive. For example, `abc123` and `ABC123` are treated as different IDs. ## Dates


    Dates are encoded as strings following the ISO 8601 standard `2025-08-01T12:00:00.000Z`. ## Pagination


    A maximum of 100 objects can be returned per request and the limit can be specified by using the pageSize query parameter. By default, the pageSize is set to 25. A `_links` object is included in paginated responses, which contains `next` and `prev` URLs to retrieve the next or previous pages of results. ## Monetary Values


    Throughout the API, monetary values are encoded as integers representing the amount in the smallest currency unit, for example 100 cents for a donation of $1.00. Currency is encoded as a string following the ISO 4217 standard (e.g. `USD`). ## Metadata


    Some objects have a metadata parameter that you can use to store key-value data. You can specify up to 20 keys, with key names up to 40 characters long and values up to 250 characters long. ## Errors


    The API returns standard HTTP response codes to indicate success or failure of API requests. Errors may include a custom error message. Error objects have these attributes, an `id`, a `message` corresponding to the HTTP response phrase of the error,

    an optional `invalid-params` attribute detailing issues with the request. An example error object returned from the API:

    ```json

    {

    error: {

    code: ''bad_request'',

    title: ''Bad request'',

    message: ''Something is wrong with your request, please check any parameters and try again'',

    reasons: [''amount is a required field'']

    }

    }

    ```


    A summary of the HTTP status codes returned from the api is listed in the table below. | Code | Title | Description |

    | ------------- |-------------| -----|

    | 200 | Success | Request successful |

    | 204 | No Content | Request successful with no content returned |

    | 400 | Bad Request | Request was invalid |

    | 401 | Unauthorised | Authorization header is invalid |

    | 403 | Forbidden | Insufficient permissions |

    | 404 | Not Found | Resource does not exist |

    | 429 | Too Many Requests | Rate Limited |

    | 500s | Internal Server Error | Something went wrong with the Goodstack API |


    # Enum Values


    Generally enum fields in our API are open-ended. New values may be added to an enum and this is not considered a breaking change. ## Integrating safely


    If your code handles enum values exhaustively — for example, a switch without a default case, or deserialisation into a strict typed enum — an unrecognised value may cause errors. We recommend adding a fallback handler for unknown enum values, so that any new value that does reach your integration degrades gracefully rather than failing.'
servers:
- url: https://api.goodstack.io
  description: Production server
- url: https://sandbox-api.goodstack.io
  description: Sandbox server
tags:
- name: Volunteering
paths:
  /v1/volunteering/opportunities:
    get:
      security:
      - SecretApiKey: []
      summary: List Volunteering Opportunities
      description: Get a paginated list of Volunteering Opportunities
      tags:
      - Volunteering
      parameters:
      - name: updatedFrom
        in: query
        description: Filter by updated at greater than or equal to
        required: false
        schema:
          type: string
          format: date-time
          example: '2025-01-15T12:00:00.000Z'
      - name: updatedTo
        in: query
        description: Filter by updated at less than
        required: false
        schema:
          type: string
          format: date-time
          example: '2025-01-15T12:00:00.000Z'
      - in: query
        name: pageSize
        required: false
        schema:
          type: integer
          minimum: 1
          default: 25
          maximum: 100
        description: How many items per page, for pagination.
      - name: status
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - draft
            - published
            - closed
            - cancelled
        style: form
        explode: true
        description: Opportunity status
      - name: expand
        in: query
        description: If provided it will attach organisation data to the response
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - organisation
        style: form
        explode: true
      - $ref: '#/components/parameters/direction'
      - $ref: '#/components/parameters/cursor'
      responses:
        '200':
          description: Successfully retrieved a page of Opportunities
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: opportunity_xxxxxxxxxxxxxxxx
                          minLength: 1
                          maxLength: 255
                          description: Unique identifier for the opportunity
                        name:
                          type: string
                          example: The Opportunity name
                          minLength: 1
                          maxLength: 255
                          description: The name of the opportunity
                        description:
                          type:
                          - string
                          - 'null'
                          example: The description of the opportunity
                          minLength: 1
                          maxLength: 5000
                          description: The description of the opportunity
                        parentId:
                          type:
                          - string
                          - 'null'
                          example: opportunity_xxxxxxxxxxxxxxxxxxxxxxxxxxxxx
                          description: If opportunity represents a child opportunity (i.e. a session in an event series), this is the parent Opportunity ID
                          minLength: 1
                          maxLength: 255
                        image:
                          type:
                          - string
                          - 'null'
                          format: url
                          example: https://example.com/image.png
                          description: image URL associated with the opportunity
                          minLength: 1
                          maxLength: 2048
                        status:
                          type: string
                          enum:
                          - draft
                          - published
                          - closed
                          - cancelled
                          example: published
                          description: The status of the opportunity
                        startDate:
                          type:
                          - string
                          - 'null'
                          format: date-time
                        endDate:
                          type:
                          - string
                          - 'null'
                          format: date-time
                        publishedAt:
                          type:
                          - string
                          - 'null'
                          format: date-time
                          description: When the opportunity was published
                          example: '2025-01-15T12:00:00.000Z'
                        location:
                          type: object
                          properties:
                            type:
                              type: string
                              enum:
                              - virtual
                              - in-person
                              example: virtual
                              description: The type of location of the opportunity
                            link:
                              type:
                              - string
                              - 'null'
                              example: https://example.com/link
                              description: Link for online opportunities
                              minLength: 1
                              maxLength: 2048
                            country:
                              type:
                              - string
                              - 'null'
                              description: ISO alpha-3 country code. Not nullable if type is in-person
                              minLength: 3
                              maxLength: 3
                              format: alpha3-country-code
                            city:
                              type:
                              - string
                              - 'null'
                              description: Applicable only if type is in-person
                              minLength: 1
                              maxLength: 255
                            zipCode:
                              type:
                              - string
                              - 'null'
                              description: Applicable only if type is in-person
                              minLength: 1
                              maxLength: 255
                            addressLineOne:
                              type:
                              - string
                              - 'null'
                              description: Applicable only if type is in-person
                              minLength: 1
                              maxLength: 255
                            addressLineTwo:
                              type:
                              - string
                              - 'null'
                              description: Applicable only if type is in-person
                              minLength: 1
                              maxLength: 255
                            locationName:
                              type:
                              - string
                              - 'null'
                              description: Applicable only if type is in-person
                              minLength: 1
                              maxLength: 255
                            locationDisplayName:
                              type:
                              - string
                              - 'null'
                              description: Applicable only if type is in-person. Display name of the opportunity location
                              minLength: 1
                              maxLength: 255
                            long:
                              type:
                              - number
                              - 'null'
                              description: Applicable only if type is in-person. Longitude of the opportunity location
                            lat:
                              type:
                              - number
                              - 'null'
                              description: Applicable only if type is in-person. Latitude of the opportunity location
                        type:
                          type: string
                          example: event
                          description: The type of the opportunity. Events are one off events, event series are opportunities with one or many sessions, projects are longer term opportunities.
                          enum:
                          - event
                          - event_series
                          - event_series_session
                          - project
                        organisationId:
                          type:
                          - string
                          - 'null'
                          example: organisation_xxxxxxxxxxxxxxxx
                          description: The organisation associated with the opportunity
                          minLength: 1
                          maxLength: 255
                        organisation:
                          allOf:
                          - $ref: '#/components/schemas/GivingOrganisationPublic'
                          description: Only included if expand=organisation is set
                        organiserId:
                          type:
                          - string
                          - 'null'
                          example: account_xxxxxxxxxxxxxxxx
                          description: Account ID associated with the organiser of the opportunity
                          minLength: 1
                          maxLength: 255
                        skills:
                          description: Skills relevant to the Opportunity
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                                minLength: 1
                                maxLength: 255
                              name:
                                type: string
                                minLength: 1
                                maxLength: 255
                        activities:
                          description: Activity tags relevant to the Opportunity
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                                minLength: 1
                                maxLength: 255
                              name:
                                type: string
                                minLength: 1
                                maxLength: 255
                        spots:
                          type:
                          - integer
                          - 'null'
                          description: Denotes how many people in total can participate in the opportunity
                        timeTracking:
                          type: string
                          enum:
                          - automatic
                          - manual
                          example: automatic
                          description: The time tracking method for the opportunity
                        targetCountries:
                          type: array
                          items:
                            type: string
                            pattern: ^[A-Z]{3}$
                            minLength: 3
                            maxLength: 3
                          description: Array of ISO alpha-3 country codes. If not provided or invalid, defaults to all countries.
                          example:
                          - AUS
                          - NZL
                        notificationsEnabled:
                          type: boolean
                          example: true
                          description: Indicates whether the organiser will receive notifications about participants registering for the opportunity or not
                        createdAt:
                          type: string
                          format: date-time
                          description: When the opportunity was created
                          example: '2025-01-15T12:00:00.000Z'
                        updatedAt:
                          type: string
                          format: date-time
                          description: When the opportunity was last updated
                          example: '2025-01-15T12:00:00.000Z'
                        cancelledAt:
                          type:
                          - string
                          - 'null'
                          format: date-time
                          description: When the opportunity was cancelled
                          example: '2025-01-15T12:00:00.000Z'
                        closedAt:
                          type:
                          - string
                          - 'null'
                          format: date-time
                          description: When the opportunity closed
                          example: '2025-01-15T12:00:00.000Z'
                  pageSize:
                    type: integer
                    example: 25
                  _links:
                    $ref: '#/components/schemas/CursorLinks'
                  object:
                    type: string
                    example: opportunity
        '400':
          $ref: '#/components/responses/IncorrectParams'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenScope'
      operationId: getV1VolunteeringOpportunities
      x-operation-id-source: derived
  /v1/volunteering/opportunity-participants:
    get:
      security:
      - SecretApiKey: []
      summary: List Volunteering Opportunity Participants
      description: Get a paginated list of Volunteering Opportunity Participants
      tags:
      - Volunteering
      parameters:
      - name: sortBy
        in: query
        description: Sort by field
        required: false
        schema:
          type: string
          enum:
          - updatedAt
          default: updatedAt
          example: updatedAt
      - name: updatedFrom
        in: query
        description: Filter by updated at greater than or equal to
        required: false
        schema:
          type: string
          format: date-time
          example: '2025-01-15T12:00:00.000Z'
      - name: updatedTo
        in: query
        description: Filter by updated at less than
        required: false
        schema:
          type: string
          format: date-time
          example: '2025-01-15T12:00:00.000Z'
      - in: query
        name: pageSize
        required: false
        schema:
          type: integer
          minimum: 1
          default: 25
          maximum: 100
        description: How many items per page, for pagination.
      - $ref: '#/components/parameters/direction'
      - $ref: '#/components/parameters/cursor'
      responses:
        '200':
          description: Successfully retrieved a list of opportunity participants
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                    description: The type of object returned
                    example: opportunity_participant
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: opportunityparticipant_xxxxxxxxxxxxxxxx
                          description: ID for the opportunity participant
                          minLength: 1
                          maxLength: 255
                        accountId:
                          type: string
                          example: account_xxxxxxxxxxxxxxxx
                          description: The account that is participating in the opportunity
                          minLength: 1
                          maxLength: 255
                        opportunityId:
                          type: string
                          example: opportunity_xxxxxxxxxxxxxxxx
                          description: The opportunity that the participant is participating in
                          minLength: 1
                          maxLength: 255
                        createdAt:
                          type: string
                          format: date-time
                          description: Date and time when the participant registered for the opportunity
                          example: '2025-01-15T12:00:00.000Z'
                        updatedAt:
                          type: string
                          format: date-time
                          example: '2025-01-15T12:00:00.000Z'
                        withdrawnAt:
                          type:
                          - string
                          - 'null'
                          format: date-time
                          example: '2025-01-15T12:00:00.000Z'
                          description: Date and time when the participant withdrew from the opportunity
                  pageSize:
                    type: integer
                    example: 25
                  _links:
                    $ref: '#/components/schemas/CursorLinks'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenScope'
      operationId: getV1VolunteeringOpportunityParticipants
      x-operation-id-source: derived
  /v1/volunteering/time-logs:
    get:
      security:
      - SecretApiKey: []
      summary: List Volunteering Time Logs
      description: Get a paginated list of Volunteering Time Logs
      tags:
      - Volunteering
      parameters:
      - name: sortBy
        in: query
        description: Sort by field
        required: false
        schema:
          type: string
          enum:
          - updatedAt
          default: updatedAt
          example: updatedAt
      - name: updatedFrom
        in: query
        description: Filter by updated at greater than or equal to
        required: false
        schema:
          type: string
          format: date-time
          example: '2025-01-15T12:00:00.000Z'
      - name: updatedTo
        in: query
        description: Filter by updated at less than
        required: false
        schema:
          type: string
          format: date-time
          example: '2025-01-15T12:00:00.000Z'
      - in: query
        name: pageSize
        required: false
        schema:
          type: integer
          minimum: 1
          default: 25
          maximum: 100
        description: How many items per page, for pagination.
      - in: query
        name: expand
        required: false
        description: If provided it will attach organisation data to the response
        schema:
          type: array
          items:
            type: string
            enum:
            - organisation
        style: form
        explode: true
      - $ref: '#/components/parameters/direction'
      - $ref: '#/components/parameters/cursor'
      responses:
        '200':
          description: Successfully retrieved a list of time logs
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                    description: The type of object returned
                    example: volunteering_time_log
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: timelog_xxxxxxxxxxxxxxxx
                          description: Unique identifier for the time log
                          minLength: 1
                          maxLength: 255
                        minutes:
                          type: integer
                          description: Denotes the amount of time (in minutes) spent on the activity
                          minimum: 0
                          maximum: 1440
                        date:
                          type: string
                          format: date
                          example: '2025-01-15'
                          description: Denotes the date of the volunteering activity
                        opportunityId:
                          type:
                          - string
                          - 'null'
                          example: opportunity_xxxxxxxxxxxxxxxx
                          description: The opportunity the time log was associated with
                          minLength: 1
                          maxLength: 255
                        organisationId:
                          type:
                          - string
                          - 'null'
                          example: organisation_xxxxxxxxxxxxxxxx
                          description: The organisation associated with the opportunity
                          minLength: 1
                          maxLength: 255
                        organisation:
                          allOf:
                          - $ref: '#/components/schemas/GivingOrganisationPublic'
                          description: Only included if expand=organisation is set
                        type:
                          type: string
                          enum:
                          - on_platform
                          - off_platform
                          example: on_platform
                          description: Whether the time log was associated with an on-platform opportunity or not
                        duringWorkingHours:
                          type: string
                          enum:
                          - 'yes'
                          - 'no'
                          - unknown
                          example: 'yes'
                          description: Whether volunteering occurred during working hours
                        skills:
                          description: Skills relevant to the Opportunity
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                                minLength: 1
                                maxLength: 255
                              name:
                                type: string
                                minLength: 1
                                maxLength: 255
                        activities:
                          description: Activity tags relevant to the Opportunity
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                                minLength: 1
                                maxLength: 255
                              name:
                                type: string
                                minLength: 1
                                maxLength: 255
                        accountId:
                          type: string
                          example: account_xxxxxxxxxxxxxxxx
                          description: The account that the time log is associated with
                          minLength: 1
                          maxLength: 255
                        loggedAt:
                          type: string
                          format: date-time
                          example: '2025-01-15T12:00:00.000Z'
                          description: When the time log was recorded
                        createdAt:
                          type: string
                          format: date-time
                          example: '2025-01-15T12:00:00.000Z'
                        updatedAt:
                          type: string
                          format: date-time
                          example: '2025-01-15T12:00:00.000Z'
                        deletedAt:
                          type:
                          - string
                          - 'null'
                          format: date-time
                          example: '2025-01-15T12:00:00.000Z'
                  pageSize:
                    type: integer
                    example: 25
                  _links:
                    $ref: '#/components/schemas/CursorLinks'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenScope'
      operationId: getV1VolunteeringTimeLogs
      x-operation-id-source: derived
components:
  parameters:
    direction:
      in: query
      name: direction
      required: false
      schema:
        type: string
        enum:
        - ASC
        - DESC
      description: Which way to sort by the given 'sort' field.  Default DESC
    cursor:
      in: query
      name: cursor
      required: false
      schema:
        type: string
        example: eyJ2IjoxLCJkIjoibmV4dCIsImlkIjoiZG9uYXRpb25fMDAwMDAwQnc3U1BhMHBxOHBRMFFsckVaWGFaN3AifQ%3D%3D
      description: A cursor that points to where to start the page
  responses:
    IncorrectParams:
      description: Error validating inputs
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  code:
                    type: string
                    example: bad_request
                  title:
                    type: string
                    example: Bad request
                  message:
                    type: string
                    example: One or more of the inputs were invalid
                  reasons:
                    type: array
                    items:
                      type: string
                      example: pageSize must be greater than or equal to 0
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  code:
                    type: string
                    example: unauthorized
                  title:
                    type: string
                    example: Unauthorized
                  message:
                    type: string
                    example: Access is denied due to invalid credentials
    ForbiddenScope:
      description: Forbidden (scope)
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  code:
                    type: string
                    example: forbidden
                  title:
                    type: string
                    example: Forbidden
                  message:
                    type: string
                    example: Access is denied due to missing scope permissions
  schemas:
    CursorLinks:
      type: object
      properties:
        current:
          type: string
          example: https://.../v1/...?cursor=eyJ2Ijox...N3AifQ%3D%3D
        next:
          type: string
          example: https://.../v1/...?cursor=eyJ2Ijox...N3AifQ%3D%3D
        prev:
          type: string
          example: https://.../v1/...?cursor=eyJ2Ijox...N3AifQ%3D%3D
    GivingOrganisationPublic:
      type: object
      description: Organisation details
      properties:
        id:
          type: string
          description: Unique identifier for the organization
          example: organisation_xxxxxxxxx
          minLength: 1
          maxLength: 255
        name:
          type: string
          description: Name of the organization
          minLength: 1
          maxLength: 255
        countryCode:
          type: string
          description: Country code of the organization
          example: GBR
          minLength: 3
          maxLength: 3
        logo:
          type:
          - string
          - 'null'
          description: URL of the organization logo
          minLength: 1
          maxLength: 2048
        website:
          type:
          - string
          - 'null'
          format: url
          description: Website associated with the organization
          minLength: 1
          maxLength: 2048
  securitySchemes:
    PublishableApiKey:
      type: apiKey
      in: header
      name: Authorization
      description: API key starting with 'pk_' that can be made public
    SecretApiKey:
      type: apiKey
      in: header
      description: API key starting with 'sk_' that must be kept secure
      name: Authorization
    DonationSessionToken:
      type: apiKey
      in: header
      name: donation-session-token
      description: Donation session token
    SCIMBearer:
      type: http
      scheme: bearer
      description: 'SCIM API key issued for the partner, presented as a bearer token in the

        `Authorization` header. The key is bound to a single partner and the

        partner must have the `scim_api` scope enabled. A missing or invalid key

        returns `401`; a valid key for a partner without the scope also returns

        `401` (`detail: "scim feature not enabled for this partner"`).

        '
